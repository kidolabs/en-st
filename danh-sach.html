<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Danh sách nhạc STORIES</title>
<style>
  :root{
    --bg:#fff7ed; --card:#ffffff; --ink:#2b2b3a; --muted:#8a8a9a;
    --brand:#ff7a59; --brand2:#ffb020; --ring:#ffd9c9; --shadow:0 6px 18px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple Color Emoji";
    background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    padding:14px 16px 16px; box-shadow:0 2px 12px rgba(0,0,0,.12);
  }
  .title{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:20px;margin:0 0 10px}
  .title small{font-weight:600;opacity:.9;font-size:13px}
  .searchbox{position:relative}
  .searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
  #q{
    width:100%; padding:14px 44px 14px 44px; border:none; border-radius:14px;
    font-size:17px; background:#fff; color:var(--ink); box-shadow:var(--shadow); outline:none;
  }
  #q:focus{box-shadow:0 0 0 4px var(--ring),var(--shadow)}
  #clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:#eee;
    width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:#666;display:none}
  .count{color:#fff;font-size:13px;font-weight:600;margin-top:8px;opacity:.95}
  main{padding:14px 12px 40px;max-width:1100px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{
    background:var(--card); border-radius:16px; overflow:hidden; box-shadow:var(--shadow);
    display:flex;flex-direction:column; position:relative;
  }
  .thumb{position:relative;aspect-ratio:1/1;background:#f0eef2;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .num{
    position:absolute; left:8px; top:8px; min-width:40px; height:40px; padding:0 8px;
    background:rgba(255,255,255,.95); color:var(--brand); border-radius:12px;
    font-weight:800; font-size:22px; display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.18); font-variant-numeric:tabular-nums;
  }
  .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#ffd9c9,#ffe9c2);color:var(--brand);font-size:40px;font-weight:800}
  .name{padding:10px 12px 12px;font-size:14px;line-height:1.3;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:16px}
  .top{position:fixed;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;
    border:none;background:var(--brand);color:#fff;font-size:22px;box-shadow:var(--shadow);
    cursor:pointer;display:none;z-index:20}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:none;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;
    background:rgba(255,255,255,.28);color:#fff;cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip small{font-weight:600;opacity:.85;margin-left:4px;font-variant-numeric:tabular-nums}
  .chip.on{background:#fff;color:var(--brand)}
  .sec{margin:22px 2px 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;scroll-margin-top:190px}
  .sec:first-child{margin-top:4px}
  .sec h2{margin:0;font-size:18px;font-weight:800}
  .sec .meta{color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .sec .lv{background:var(--ring);color:var(--brand);border-radius:8px;padding:2px 7px;font-size:12px;font-weight:800}
  @media (max-width:420px){ .grid{grid-template-columns:repeat(2,1fr);gap:10px} .num{font-size:20px} }
</style>
</head>

<header>

  <div class="searchbox">

    <input id="q" type="search" inputmode="search" placeholder="Tìm tên bài hoặc số..." autocomplete="off" />

  <div class="count" id="count"></div>
</header>
<main>

2/fairy-tale-barn/C0012417.jpg", "g": "fairy-tale-barn", "gl": "Fairy Tale Barn", "lv": 2}, {"n": 805, "t": "The Three Billy Goats Gruff 2 A Windy Idea", "img": "https://pub-0e0f52f13bb14693b0ce66f814b5e91c.r2.dev/media/L2/fairy-tale-barn/C0012418.jpg", "g": "fairy-tale-barn", "gl": "Fairy Tale Barn", "lv": 2}, {"n": 806, "t": "The Three Billy Goats Gruff 3 Trip, Trap!", "img": "https://pub-0e0f52f13bb14693b0ce66f814b5e91c.r2.dev/media/L2/fairy-tale-barn/C0012419.jpg", "g": "fairy-tale-barn", "gl": "Fairy Tale Barn", "lv": 2}, {"n": 807, "t": "The Three Billy Goats Gruff 4 A Big Surprise", "img": "https://pub-0e0f52f13bb14693b0ce66f814b5e91c.r2.dev/media/L2/fairy-tale-barn/C0012420.jpg", "g": "fairy-tale-barn", "gl": "Fairy Tale Barn", "lv": 2}];
const TOTAL = TRACKS.length;
const empty = document.getElementById('empty');
const countEl = document.getElementById('count');
const q = document.getElementById('q');
const clearBtn = document.getElementById('clear');

const norm = s => (s||'').toString().toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g,'');

// groups = contiguous runs of the same topic (card order)
const GROUPS = [];
for(const t of TRACKS){
  const last = GROUPS[GROUPS.length-1];
  if(last && last.g===t.g){ last.items.push(t); last.to=t.n; }
  else GROUPS.push({g:t.g, gl:t.gl, lv:t.lv, from:t.n, to:t.n, items:[t]});
}
const pad = n => String(n).padStart(3,'0');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const list = document.getElementById('list');
const chips = document.getElementById('chips');
let cur = 'all';
const nodes = [];
const frag = document.createDocumentFragment();
GROUPS.forEach((G,gi)=>{
  G.id = 'g'+gi;
  const sec = document.createElement('div');
  sec.className = 'sec'; sec.id = G.id;
  sec.innerHTML = '<h2>'+esc(G.gl)+'</h2>'+(G.lv?'<span class="lv">L'+G.lv+'</span>':'')
    + '<span class="meta">'+pad(G.from)+'–'+pad(G.to)+' · '+G.items.length+' bài</span>';
  const grid = document.createElement('div');
  grid.className = 'grid';
  for(const t of G.items){
    const numStr = pad(t.n);
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.n = t.n;
    card.dataset.s = norm(t.t) + ' ' + numStr + ' ' + t.n + ' ' + norm(G.gl);
    card.innerHTML =
      '<div class="thumb">'
      + '<div class="num">'+numStr+'</div>'
      + (t.img
          ? '<img loading="lazy" src="'+t.img+'" alt="" onerror="this.style.display=\'none\';this.parentNode.querySelector(\'.fallback\').style.display=\'flex\'">'
          : '')
      + '<div class="fallback"'+(t.img?'':' style="display:flex"')+'>'+numStr+'</div>'
      + '</div>'
      + '<div class="name">'+esc(t.t)+'</div>';
    grid.appendChild(card);
    nodes.push(card);
  }
  G.sec = sec; G.grid = grid; G.cards = nodes.slice(nodes.length-G.items.length);
  frag.appendChild(sec); frag.appendChild(grid);
});
list.appendChild(frag);

function chip(id, label, sub){
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.id = id;
  b.innerHTML = esc(label) + (sub?'<small>'+sub+'</small>':'');
  b.addEventListener('click', ()=>{ cur = id; apply(); window.scrollTo({top:0}); });
  chips.appendChild(b);
}
chip('all','Tất cả', TOTAL);
for(const G of GROUPS) chip(G.id, G.gl, pad(G.from)+'–'+pad(G.to));

function apply(){
  const raw = q.value.trim();
  const terms = norm(raw).split(/\s+/).filter(Boolean);
  let shown = 0;
  for(const G of GROUPS){
    const inGroup = cur==='all' || cur===G.id;
    let gs = 0;
    for(const c of G.cards){
      const ok = inGroup && terms.every(t => c.dataset.s.includes(t));
      c.style.display = ok ? '' : 'none';
      if(ok) gs++;
    }
    G.sec.style.display = G.grid.style.display = gs ? '' : 'none';
    shown += gs;
  }
  for(const b of chips.children) b.classList.toggle('on', b.dataset.id===cur);
  empty.hidden = shown>0;
  const scope = cur==='all' ? TOTAL : GROUPS.find(G=>G.id===cur).items.length;
  countEl.textContent = (raw || cur!=='all') ? (shown+' / '+scope+' bài'+(cur!=='all'?' · '+GROUPS.find(G=>G.id===cur).gl:'')) : ('Tổng cộng '+TOTAL+' bài · '+GROUPS.length+' nhóm');
  clearBtn.style.display = raw ? 'block' : 'none';
}
q.addEventListener('input', apply);
clearBtn.addEventListener('click', ()=>{ q.value=''; apply(); q.focus(); });
apply();

const topBtn = document.getElementById('top');
window.addEventListener('scroll', ()=>{ topBtn.style.display = window.scrollY>600 ? 'block':'none'; });
topBtn.addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));
</script>
